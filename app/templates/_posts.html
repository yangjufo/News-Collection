<div class="mod articles">
    <div id="articleList" class="article-list mod " data-pagetag="index" data-fr="idx">
        {% for article in articles %}
            <div class="article-info">
                <div class="art-img">
                    <a href="{{ article.url }}" target="_blank">
                        <img src="{{ article.image }}" onerror="this.onerror=null;this.src='/static/logo.png';">
                    </a>
                </div>
                <div class="art-info" style="width: auto">
                    <div class="title">
                        <a href="{{ article.url }}" target="_blank">
                            {{ article.title }}
                        </a>
                    </div>
                    <div class="art-other">
                        <div class="author">
                            {{ article.web_site }}
                            <p class="info">&nbsp;&nbsp;{{ article.publish_time }}</p>
                        </div>

                        <div class="tags">
                            <span>{{ article.category }}</span>
                        </div>
                    </div>
                </div>
            </div>
        {% else %}
            <div class="alert alert-info text-center" style="margin: 40px auto; max-width: 600px; padding: 25px;">
                <p style="font-size: 18px; margin-bottom: 10px;"><strong>No articles found in this category yet.</strong></p>
                <p>Run <code>python manage.py crawl</code> to fetch the latest news stories.</p>
            </div>
        {% endfor %}

    </div>
</div>
